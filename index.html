<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVOYS — SS26</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --accent-gold: #c5a059;
            --text-main: #f3f3f3;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 13, 13, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-decoration: none;
        }

        .logo span {
            color: #ff3333;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-main);
            margin-left: 25px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links button:hover {
            color: var(--accent-gold);
        }

        /* Hero */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-muted);
            letter-spacing: 3px;
            font-size: 0.9rem;
        }

        /* Controls / Filters */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .filters button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .filters button.active, .filters button:hover {
            color: #fff;
            border-color: var(--accent-gold);
            background: rgba(197, 160, 89, 0.1);
        }

        /* Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .product-category {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .btn-view {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-card:hover .btn-view {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: #fff; font-size: 1.5rem;
            cursor: pointer;
        }

        .size-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .size-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            cursor: pointer;
        }

        .size-btn.selected {
            border-color: var(--accent-gold);
            background: var(--accent-gold);
            color: #000;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .spec-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .spec-table td:first-child {
            color: var(--text-muted);
        }

        .btn-add {
            width: 100%;
            padding: 15px;
            background: var(--text-main);
            color: #000;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            top: 0; right: -400px;
            width: 380px; height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 300;
            padding: 30px;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open { right: 0; }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">BV<span>X</span>YS</a>
        <div class="nav-links">
            <button onclick="location.href='gallery.html'">Gallery</button>
            <button onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
        </div>
    </nav>

    <section class="hero">
        <h1>SPRING / SUMMER 2026</h1>
        <p>AVANT-GARDE LUXURY — NO TECH PACKS, JUST FASHION</p>
    </section>

    <div class="controls">
        <div class="filters">
            <button class="active" onclick="filterCategory(event,'All')">All</button>
            <button onclick="filterCategory(event,'Denim')">Denim</button>
            <button onclick="filterCategory(event,'Tops')">Tops</button>
            <button onclick="filterCategory(event,'Pants')">Pants</button>
            <button onclick="filterCategory(event,'Outerwear')">Outerwear</button>
            <button onclick="filterCategory(event,'Dresses')">Dresses</button>
            <button onclick="filterCategory(event,'Traditional')">Traditional</button>
        </div>
    </div>

    <main class="product-grid" id="grid"></main>

    <!-- Product Modal -->
    <div class="modal" id="modal">
        <div class="modal-content" role="dialog" aria-modal="true">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>YOUR BAG</h2>
            <button class="close-btn" style="position:static" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
            <p>TOTAL: <span id="cart-total">0</span> SAR</p>
            <button class="btn-add" onclick="alert('Checkout integration ready.')">CHECKOUT</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Starlight Denim", category: "Denim", price: 1250, fabric: "100% Cotton Denim (13.5 oz)", desc: "Wide leg denim with all-over splatter effect, curved seam construction,[...]"},
            { id: 2, name: "Structured Wrap Pleated Pants", category: "Pants", price: 1100, fabric: "100% Cotton Twill (280 GSM)", desc: "High-waisted wide leg pants featuring structured wrap fro[...]"},
            { id: 3, name: "Dragonfly Structured Shirt", category: "Tops", price: 850, fabric: "100% Cotton Poplin (180 GSM)", desc: "Oversized silhouette with extended shoulder caps, wide pointe[...]"},
            { id: 4, name: "Dragonfly Organic Sculpted Dress", category: "Dresses", price: 3400, fabric: "Sheer Organza & Linen Blend", desc: "Sculptural dress with leaf-like panels and intricate[...]"},
            { id: 5, name: "Leopard Crystal Flare Jeans", category: "Denim", price: 1450, fabric: "100% Cotton Denim (14 oz)", desc: "All-over leopard print with crystal embellishments, dragonfly[...]"},
            { id: 6, name: "Cream Dragonfly Slit Flare Pants", category: "Pants", price: 980, fabric: "100% Cotton Twill (12 oz)", desc: "Front crease detailing with side slit hems, custom dragon[...]"},
            { id: 7, name: "Washed Green Baggy Carpenter Denim", category: "Denim", price: 1150, fabric: "100% Cotton Denim (14.5 oz)", desc: "Garment-washed faded green denim featuring custom ha[...]"},
            { id: 8, name: "Long Sleeve Tee & Chino Set", category: "Tops", price: 750, fabric: "240 GSM Cotton Jersey", desc: "Boxy fit grey long sleeve tee with star-ring embroidered logo, pair[...]"},
            { id: 9, name: "Leopard Crest Henley", category: "Tops", price: 680, fabric: "250 GSM Cotton Jersey", desc: "White 3-button placket top with embroidered chest crest, historical leopar[...]"},
            { id: 10, name: "Distressed Pink Denim Jeans", category: "Denim", price: 1300, fabric: "100% Cotton Denim (13.5 oz)", desc: "Heavy distressed details with pink frayed patchwork and dr[...]"},
            { id: 11, name: "High-Sheen Leather Bomber Jacket", category: "Outerwear", price: 2100, fabric: "High-Sheen Coated PU/Leather", desc: "Two-way metallic zip closure with dragonfly skul[...]"},
            { id: 12, name: "Vintage Off-White Buffer Jacket", category: "Outerwear", price: 1850, fabric: "Premium Nylon Shell", desc: "Oversized fill buffer jacket with snap-button collar, zip [...]"},
            { id: 13, name: "Tailored Wool Suit Set", category: "Outerwear", price: 2900, fabric: "420 GSM Premium Wool Blend (70% Wool)", desc: "Cropped jacket with hidden snap closure and drago[...]"},
            { id: 14, name: "White Thobe Traditional Set", category: "Traditional", price: 1600, fabric: "100% Premium Cotton (120-140 GSM)", desc: "Minimalist white thobe with concealed placket,[...]"},
        ];

        let cart = [];
        let selectedSize = 'M';

        // Load cart from localStorage
        function loadCart() {
            try {
                const raw = localStorage.getItem('bvoys_cart');
                if (raw) cart = JSON.parse(raw);
            } catch (e) {
                console.warn('Failed to load cart from localStorage', e);
                cart = [];
            }
        }

        function saveCart() {
            try {
                localStorage.setItem('bvoys_cart', JSON.stringify(cart));
            } catch (e) {
                console.warn('Failed to save cart', e);
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = items.map(p => `
                <div class="product-card" onclick="openModal(${p.id})">
                    <div>
                        <div class="product-category">${p.category}</div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} SAR</div>
                    </div>
                    <button class="btn-view">View Piece</button>
                </div>
            `).join('');
        }

        function filterCategory(e, cat) {
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            const btn = (e && (e.currentTarget || e.target)) ? (e.currentTarget || e.target).closest('button') : null;
            if (btn) btn.classList.add('active');
            if (cat === 'All') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function openModal(id) {
            const p = products.find(prod => prod.id === id);
            selectedSize = 'M';
            document.getElementById('modal-body').innerHTML = `
                <h2 class="brand-font" style="margin-bottom:10px;">${p.name}</h2>
                <p style="color:var(--accent-gold); font-size:1.2rem; margin-bottom:15px;">${p.price} SAR</p>
                <p style="color:var(--text-muted); line-height:1.6; margin-bottom:20px;">${p.desc}</p>
                
                <p style="font-size:0.8rem; text-transform:uppercase; letter-spacing:1px;">Select Size:</p>
                <div class="size-selector">
                    ${['S', 'M', 'L'].map(sz => `<button class="size-btn ${sz === 'M' ? 'selected' : ''}" onclick="selectSize(this, '${sz}')">${sz}</button>`).join('')}
                </div>

                <table class="spec-table">
                    <tr><td>Fabric</td><td>${p.fabric}</td></tr>
                    <tr><td>Fit</td><td>Signature BVOYS Oversized / Architectural</td></tr>
                    <tr><td>Hardware</td><td>Custom Dragonfly Engraved Buttons & Rivets</td></tr>
                </table>

                <button class="btn-add" onclick="addToCart(${p.id})">Add To Bag</button>
            `;

            const modal = document.getElementById('modal');
            modal.style.display = 'flex';

            // add outside click handler
            modal.addEventListener('click', outsideModalClick);
            // add ESC handler
            document.addEventListener('keydown', escKeyHandler);
        }

        function outsideModalClick(e) {
            const modal = document.getElementById('modal');
            if (e.target === modal) closeModal();
        }

        function escKeyHandler(e) {
            if (e.key === 'Escape') closeModal();
        }

        function selectSize(btn, sz) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSize = sz;
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
            modal.removeEventListener('click', outsideModalClick);
            document.removeEventListener('keydown', escKeyHandler);
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            cart.push({ ...p, size: selectedSize });
            updateCart();
            closeModal();
            toggleCart(true);
            saveCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            let total = 0;
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted)">Your bag is empty</p>';
            } else {
                container.innerHTML = cart.map((item, index) => {
                    total += item.price;
                    return `
                        <div class="cart-item">
                            <div>
                                <div><strong>${item.name}</strong></div>
                                <div style="font-size:0.8rem; color:var(--text-muted);">Size: ${item.size}</div>
                                <div style="font-size:0.85rem;">${item.price} SAR</div>
                            </div>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff3333; cursor:pointer;">&times;</button>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('cart-total').innerText = total;
            saveCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart(forceOpen = false) {
            const drawer = document.getElementById('cart-drawer');
            if (forceOpen) drawer.classList.add('open');
            else drawer.classList.toggle('open');
        }

        // Initialize Storefront
        (function init(){
            loadCart();
            renderProducts(products);
            updateCart();
        })();
    </script>
</body>
</html>
