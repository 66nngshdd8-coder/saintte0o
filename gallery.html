<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — BVOYS</title>
  <style>
    :root{--bg:#0d0d0d;--card:#141414;--gold:#c5a059;--text:#f3f3f3;--muted:#888}
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;}
    .container{max-width:1200px;margin:80px auto;padding:20px}
    h1{font-family:'Cormorant Garamond',serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:var(--card);border:1px solid #222;padding:12px;cursor:pointer}
    .card img{width:100%;height:220px;object-fit:cover;display:block}
    .card .caption{font-size:0.9rem;margin-top:8px;color:var(--muted)}
    /* modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}
    .modal .box{background:var(--bg);max-width:1000px;width:100%;max-height:90vh;overflow:auto;border:1px solid #222;padding:18px}
    .modal img{width:100%;height:auto;display:block}
    .meta{margin-top:12px;color:var(--muted)}
    .close{position:absolute;right:20px;top:18px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer}
  </style>
</head>
<body>
  <div class="container">
    <h1>Gallery</h1>
    <div id="grid" class="grid" aria-live="polite"></div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="box">
      <button class="close" onclick="closeModal()">&times;</button>
      <img id="modal-img" src="" alt="">
      <div id="modal-caption" class="meta"></div>
      <div id="modal-tags" class="meta"></div>
    </div>
  </div>

  <script>
    async function loadData(){
      try{
        const res = await fetch('public/gallery.json');
        const items = await res.json();
        render(items);
      }catch(e){
        document.getElementById('grid').innerHTML = '<p style="color:#f3f3f3">Failed to load gallery metadata.</p>';
        console.error(e);
      }
    }

    function render(items){
      const grid = document.getElementById('grid');
      grid.innerHTML = items.map(it => `
        <article class="card" tabindex="0" onclick="openModal('${it.filename}')" onkeypress="if(event.key==='Enter')openModal('${it.filename}')">
          <img loading="lazy" src="public/images/${it.filename}" alt="${it.alt}">
          <div class="caption">${it.title}</div>
        </article>
      `).join('');
    }

    function openModal(filename){
      fetch('public/gallery.json').then(r=>r.json()).then(items=>{
        const it = items.find(i=>i.filename===filename);
        if(!it) return;
        const img = document.getElementById('modal-img');
        img.src = 'public/images/'+it.filename;
        img.alt = it.alt || '';
        document.getElementById('modal-caption').innerText = it.caption || '';
        document.getElementById('modal-tags').innerText = it.tags ? 'Tags: '+it.tags.join(', ') : '';
        document.getElementById('modal').classList.add('open');
      });
    }
    function closeModal(){document.getElementById('modal').classList.remove('open');}
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
    loadData();
  </script>
</body>
</html>
